<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setembro Amarelo</title>
    <link rel="stylesheet" href="desenvolvimento/estilo.css">
    <link rel="icon" href="img/faixa_amarela.png">
</head>
<body>
    <header class="topbar">
        <h1>Setembro Amarelo</h1>
    </header>

    <main class="app-shell">
        <section class="quote-section">
            <div class="quote-wrap">
                <div class="icon-wrap">
                    <img src="img/mental-health.png" alt="Ícone de acolhimento emocional">
                </div>

                <article class="quote-card">
                    <p id="frase" class="quote-text"></p>
                </article>

                <button class="quote-button" onclick="gerador()">Nova Frase</button>
            </div>
        </section>
    </main>

    <script src="desenvolvimento/app.js"></script>
</body>
</html>
