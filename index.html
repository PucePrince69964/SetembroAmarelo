<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setembro Amarelo</title>
    <link rel="stylesheet" href="src/estilo.css">
    <link rel="icon" href="public/faixa_amarela.png">
</head>
<body>
    <header class="topbar">
        <h1>Setembro Amarelo</h1>
    </header>

    <main class="app-shell">
        <section class="quote-section">
            <div class="quote-wrap">
                <div class="icon-wrap">
                    <img src="public/mental-health.png" alt="Ícone de acolhimento emocional">
                </div>

                <article class="quote-card">
                    <p id="frase" class="quote-text"></p>
                </article>

                <button class="quote-button" onclick="gerador()">Nova Frase</button>
            </div>
        </section>
    </main>

    <footer>
        <h1>Contribuidores</h1>
        <div class="logos">
            <div class="item">
                <a href="https://github.com/PucePrince69964/SetembroAmarelo/blob/main/README.md">
                    <img src="public/github.png" class="github" alt="Github" height="30px">
                </a>
                <p>GitHub</p>
            </div>
        </div>
    </footer>

    <script src="src/app.js"></script>
</body>
</html>
